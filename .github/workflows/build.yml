name: Build and Package VSIX

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six targets now run on a runner with matching OS+arch — no
          # cross-install required. The script still wipes other bindings
          # before packaging just to be safe.
          - target: win32-x64
            os: windows-latest
          - target: win32-arm64
            os: windows-11-arm
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-x64
            os: macos-26-intel
          - target: darwin-arm64
            os: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Package VSIX for ${{ matrix.target }}
        run: node scripts/package.mjs --target ${{ matrix.target }}

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v5
        with:
          name: file-sql-${{ matrix.target }}
          path: out/*.vsix
          if-no-files-found: error
          retention-days: 14
