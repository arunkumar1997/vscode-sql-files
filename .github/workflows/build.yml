name: Build and Package VSIX

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Recommended version for modern VS Code extensions
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Uses clean install for more reliable builds

      - name: Build and Package Extension
        run: bash build.sh

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-sql-extension
          path: '*.vsix'
          retention-days: 14 # Keeps the artifact for 14 days
