name: Release

# Manual-only. Tag pushes intentionally do NOT publish — verify the artifacts
# produced by `build.yml` first, then trigger this workflow from the Actions
# tab with `publish=true` (and optionally `tag=vX.Y.Z` to attach a GitHub
# Release).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish all VSIX files to VS Code Marketplace (and Open VSX if OVSX_PAT is set)"
        type: boolean
        default: false
      create_release:
        description: "Create a draft GitHub Release with the VSIX files attached"
        type: boolean
        default: false
      tag:
        description: "Tag name for the GitHub Release (only used if create_release=true). Defaults to package.json version."
        type: string
        default: ""

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: win32-arm64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX for ${{ matrix.target }}
        run: node scripts/package.mjs --target ${{ matrix.target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: file-sql-${{ matrix.target }}
          path: out/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to Marketplaces
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: List artifacts
        run: ls -la out/

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for vsix in out/*.vsix; do
            echo "Publishing $vsix"
            npx --no-install vsce publish --packagePath "$vsix"
          done

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for vsix in out/*.vsix; do
            echo "Publishing $vsix to Open VSX"
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          done

  gh-release:
    name: Attach VSIX to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./package.json').version")
            echo "value=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: out/*.vsix
          draft: true
          generate_release_notes: true
